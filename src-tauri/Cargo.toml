[package]
name = "youtube-desktop"
version = "0.19.0"
description = "YouTube Desktop"
[lib]
name = "youtube_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
description = "YouTube Desktop built with Tauri 2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
base64 = "0.22"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.8.3"
zip = "9.1.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
