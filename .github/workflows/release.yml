# 发布流程（参考 whf-stock-board release.yml）：
# - 推送 v* tag → GitHub Actions 构建桌面（msi / nsis）+ 安卓（arm64 apk），
#   进同一个 GitHub Release
# - Release 描述由上一个可到达 tag 到当前 tag 的提交主题自动生成
#   （提交须遵循 conventional commits：feat:/fix:/refactor: ...）
# - 守卫：tag 指向的提交必须可从 main 到达，防止绕过分支保护直接发版
#
# 安卓 job 前置（沿用 whf-stock-board mobile 口径）：
# 1. src-tauri/tauri.android.conf.json 提供 beforeBuildCommand（pnpm build:mobile）
# 2. gen/android 已 gitignore，CI 内 tauri android init 重建
# 3. 签名：Secrets 的 ANDROID_KEYSTORE(base64) / ANDROID_KEYSTORE_PASSWORD /
#    ANDROID_KEY_ALIAS 做 zipalign + apksigner 签名；未配置时上传未签名 APK 并告警
#    （未签名 APK 无法安装，仅可 adb install -t 调试）
# 4. 只编 arm64：真机均为 arm64，universal 四 ABI 会让 APK 膨胀（单 arm64 约 1/4 体积）

name: Release App (Desktop / Android)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# 同一 tag 的发布串行化，避免竞写同一 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop（Windows msi / nsis）
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉全量历史，供「tag 是否在 main 上」的祖先校验与变更列表生成使用
          fetch-depth: 0

      # 发布守卫：tag 指向的提交必须可从 main 到达
      - name: Verify tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "tag ${GITHUB_REF_NAME} 位于 main 分支历史上，允许发布"
          else
            echo "::error::tag ${GITHUB_REF_NAME} 的提交不在 main 分支上，拒绝发布"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 从上一个可到达 tag 到当前 HEAD 的提交主题生成带编号的变更列表，
      # 作为 Release 描述。锚定 HEAD^：tag 触发时 HEAD 即当前 tag（describe 取上一个 tag）
      - name: Generate release notes
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            SUBJECTS=$(git log --pretty=format:"%s" "${PREV_TAG}..HEAD")
          else
            SUBJECTS=$(git log --pretty=format:"%s")
          fi
          NUMBERED=$(echo "$SUBJECTS" | sed '/^$/d' | awk '{printf "%d. %s\n", NR, $0}')
          {
            echo "body<<CHANGELOG_EOF"
            echo "## 更新内容"
            echo ""
            echo "$NUMBERED"
            echo ""
            echo "下载下方 Assets 中的安装包（*_x64-setup.exe 或 *.msi）即可安装。"
            echo ""
            echo "## 安全提示"
            echo ""
            echo "本应用未购买代码签名证书，首次运行时 Windows SmartScreen / Defender 可能提示「已保护你的电脑」或误报病毒，属无签名二进制的常见误报，安装包由 GitHub Actions 从公开源码构建，可自行审计。"
            echo "处理方式：点击「更多信息」→「仍要运行」；也可将安装包提交微软误报分析：https://www.microsoft.com/en-us/wdsi/filesubmission"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'YouTube Desktop v__VERSION__'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false

  android:
    name: Android（arm64 APK）
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与桌面 job 同一守卫：tag 必须在 main 历史上
      - name: Verify tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "tag ${GITHUB_REF_NAME} 位于 main 分支历史上，允许发布"
          else
            echo "::error::tag ${GITHUB_REF_NAME} 的提交不在 main 分支上，拒绝发布"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ubuntu runner 自带 ANDROID_HOME 与 cmdline-tools；补装固定版本 NDK 并导出 NDK_HOME
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve release version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Init Android project (gen/android 不入库，CI 重建)
        run: pnpm tauri android init

      - name: Build APK (arm64)
        run: pnpm tauri android build --apk --target aarch64

      # tauri android build 产出的是未签名 APK，用 Secrets 里的 keystore 做 zipalign + 签名
      # （步骤与 whf-stock-board release.yml 同源：RUNNER_TEMP 存 keystore、--key-pass 同
      #   keystore 口令、签名后 verify --print-certs 并清理密钥文件）
      - name: Sign APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          IN=$(find src-tauri/gen/android/app/build/outputs/apk -name '*unsigned.apk' | head -1)
          echo "unsigned apk: $IN"
          OUT="youtubedesktop_${VERSION_TAG}_arm64.apk"
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT"
          rm -f "$RUNNER_TEMP/release.keystore"

      # 桌面 job 的 tauri-action 创建 Release 有先后，轮询等待其出现（上限 10 分钟）
      - name: Wait for release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release $VERSION_TAG 已就绪"
              exit 0
            fi
            sleep 10
          done
          echo "::error::等待 Release $VERSION_TAG 超时（桌面 job 未创建？）"
          exit 1

      # 追加到同版本 Release（桌面 job 的 tauri-action 已创建）
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          files: youtubedesktop_*_arm64.apk
          fail_on_unmatched_files: true
